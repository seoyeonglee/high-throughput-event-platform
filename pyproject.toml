[project]
name = "high-throughput-event-platform"
version = "1.0.0"
description = "Production-oriented event ingestion and asynchronous processing platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.50",
  "asyncpg==0.30.0",
  "redis==5.2.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.8.1",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
  "ruff==0.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = ["integration: requires real Redis and PostgreSQL (RUN_INTEGRATION=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
